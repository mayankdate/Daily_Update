# THE DAILY BRIEF — preferences for build_brief.ipynb.
# UTF-8; spaces rather than tabs. Dates/IDs are strings; null means no direct RSS.
# Existing settings and topic/source field shapes are retained for compatibility.
# Personal integrations, dates, music and comics are preserved as supplied.
#
# COVERAGE: English-language editions, with sources covering Europe, Asia,
# Africa, the Middle East, Latin America and Oceania as well as North America.
# news_hl/news_gl/news_ceid configure ONE Google News edition, not a worldwide
# filter. The existing English/India edition is retained; global coverage comes
# primarily from the curated publishers. Multi-edition retrieval and regional
# quotas require fetcher changes; do not add inert config options for them here.
# English feeds/discovery are preferred; strict language detection requires code.
#
# RANKING: weights total 100; max_per_source=2 encourages source variety.
# Caps are per SOURCE ID, not necessarily publisher: Guardian section IDs share
# one publisher. Publisher caps, story deduplication and subtopic quotas need code.
# Dedicated sources bypass keyword matching: reserve them for focused feeds.
# Broad tech, film/TV, fashion and world-news publishers remain keyword-filtered.
# Exclusions reduce spoiler/clickbait exposure; they cannot guarantee spoiler-free.
# News lookback remains 7 days; RSS often holds fewer than 7 days of stories.
# Movies/Shows is a news watchlist, not a verified streaming-availability calendar.
# Country-specific release dates and catalogue availability vary.
#
# SOURCES: scores are editorial preferences, not factual accuracy probabilities.
# Vendor/official announcements are useful primary reporting, not independent reviews.
# RSS URLs are publisher endpoints/discovered feeds; not all were live-tested.
# null sources rely on the existing Google discovery path; keep it enabled.
# Some publishers are paywalled; headlines may be accessible while articles are not.
# Tokens stay in local token files/environment variables, never in this YAML.

