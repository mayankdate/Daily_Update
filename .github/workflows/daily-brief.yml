name: Build the Daily Brief
on:
  schedule:
    # Four runs daily: 00:47, 06:47, 12:47 and 18:47 in your chosen timezone.
    # Keep EXACTLY ONE cron line uncommented. All cron expressions below use UTC.
    # Switch timezone by commenting the active line and uncommenting an alternative.
    # UTC schedules do not adjust for daylight saving: switch seasonal lines as needed.
    # These are target times; GitHub may delay or skip scheduled runs.

    - cron: '17 1,7,13,19 * * *'     # IST  (India, UTC+5:30): 00:47, 06:47, 12:47, 18:47

    # --- HOT-SWAPPABLE TIMEZONE OPTIONS: SAME FOUR LOCAL TIMES ---
    # - cron: '47 0,6,12,18 * * *'   # UTC / GMT             : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 5,11,17,23 * * *'  # EST  (US Eastern, -5)  : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 4,10,16,22 * * *'  # EDT  (US Eastern, -4)  : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 2,8,14,20 * * *'   # PST  (US Pacific, -8)  : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 1,7,13,19 * * *'   # PDT  (US Pacific, -7)  : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 5,11,17,23 * * *'  # BST  (UK summer, +1)   : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 5,11,17,23 * * *'  # CET  (Central Europe,+1): 00:47, 06:47, 12:47, 18:47
    # - cron: '47 4,10,16,22 * * *'  # CEST (Central Europe,+2): 00:47, 06:47, 12:47, 18:47
    # - cron: '47 3,9,15,21 * * *'   # JST  (Japan, +9)       : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 2,8,14,20 * * *'   # AEST (Australia, +10)  : 00:47, 06:47, 12:47, 18:47
    # - cron: '47 1,7,13,19 * * *'   # AEDT (Australia, +11)  : 00:47, 06:47, 12:47, 18:47

  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-brief-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build edition
        env:
          NOTION_TASKS_TOKEN: ${{ secrets.NOTION_TASKS_TOKEN }}
          NOTION_WORKOUT_TOKEN: ${{ secrets.NOTION_WORKOUT_TOKEN }}
        run: python -m nbconvert --to notebook --execute scripts/build_brief.ipynb --output /tmp/daily-brief-executed.ipynb --ExecutePreprocessor.timeout=600
      - name: Commit rendered edition
        run: |
          git config user.name 'mayankdate'
          git config user.email 'mayank.date@gmail.com'
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily brief'
            git push
          fi
