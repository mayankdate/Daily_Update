name: Build the Daily Brief
on:
  schedule:
    - cron: '30 0,6,12,18 * * *' # 06:00, 12:00, 18:00, 00:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-brief-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build edition
        env:
          NOTION_TASKS_TOKEN: ${{ secrets.NOTION_TASKS_TOKEN }}
          NOTION_WORKOUT_TOKEN: ${{ secrets.NOTION_WORKOUT_TOKEN }}
        run: python -m nbconvert --to notebook --execute scripts/build_brief.ipynb --output /tmp/daily-brief-executed.ipynb --ExecutePreprocessor.timeout=600
      - name: Commit rendered edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily brief'
            git push
          fi
