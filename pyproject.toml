[project]
name = "daily-update"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3,<3",
    "feedparser>=6.0.11,<7",
    "jinja2>=3.1.6,<4",
    "python-dateutil>=2.9.0.post0,<3",
    "tzdata>=2024.2",
    "PyYAML>=6.0.2,<7",
    # The workflow runs build_brief.ipynb headlessly, so these are needed at run time.
    "nbformat>=5.10,<6",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<8",
]
